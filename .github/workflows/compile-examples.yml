name: Compile SDK examples

on:
  pull_request:
    paths:
      - 'c\+\+_win/**'
      - '.github/workflows/compile-examples.yml'
      - 'tests/kine_smoke.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        standard: [c++11, c++17]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and link examples without running them
        env:
          CPP_STANDARD: ${{ matrix.standard }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-examples"
          for source in c++_win/*.cpp; do
            library=MarvinSDK
            case "$source" in
              c++_win/my_dd.cpp|c++_win/movl_demo.cpp|c++_win/movlkeepj_demo.cpp) library=Kine ;;
            esac
            output="$RUNNER_TEMP/sdk-examples/$(basename "${source%.cpp}")"
            g++ -std="$CPP_STANDARD" -Wall -Wextra "$source" -Lc++_win -l"$library" -o "$output"
          done
      - name: Check offline FK, IK and Jacobian
        env:
          CPP_STANDARD: ${{ matrix.standard }}
        run: |
          g++ -std="$CPP_STANDARD" -pedantic-errors -Wall -Wextra -Wconversion -Werror \
            tests/kine_smoke.cpp -Ic++_win -Lc++_win -lKine -o "$RUNNER_TEMP/kine-smoke"
          LD_LIBRARY_PATH="$PWD/c++_win" "$RUNNER_TEMP/kine-smoke" "$PWD/c++_win"

  compile-windows32:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the 32-bit Windows cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686-posix
      - name: Cross-compile and link examples without running them
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-windows32"
          for standard in c++11 c++17; do
            for source in c++_win/*.cpp; do
              library=MarvinSDK
              case "$source" in
                c++_win/my_dd.cpp|c++_win/movl_demo.cpp|c++_win/movlkeepj_demo.cpp) library=Kine ;;
              esac
              output="$RUNNER_TEMP/sdk-windows32/$(basename "${source%.cpp}")-$standard.exe"
              i686-w64-mingw32-g++-posix -std="$standard" -Wall -Wextra \
                "$source" -Lc++_win -l"$library" -o "$output"
            done
          done
      - name: Prepare offline math checks for Windows
        run: |
          bundle="$RUNNER_TEMP/kine-windows32"
          mkdir -p "$bundle"
          for standard in c++11 c++17; do
            i686-w64-mingw32-g++-posix -std="$standard" -pedantic-errors \
              -Wall -Wextra -Wconversion -Werror tests/kine_smoke.cpp \
              -Ic++_win -Lc++_win -lKine -o "$bundle/kine-smoke-$standard.exe"
          done
          cp c++_win/libKine.dll c++_win/ccs_m3.MvKDCfg \
            c++_win/ccs_m6.MvKDCfg c++_win/srs.MvKDCfg "$bundle/"
          for name in libgcc_s_dw2-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            runtime=$(i686-w64-mingw32-g++-posix -print-file-name="$name")
            test -f "$runtime"
            cp "$runtime" "$bundle/"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kine-windows32
          path: ${{ runner.temp }}/kine-windows32
          if-no-files-found: error
          retention-days: 1

  check-windows32-math:
    needs: compile-windows32
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kine-windows32
          path: ${{ runner.temp }}/kine-windows32
      - name: Run only offline kinematics checks
        working-directory: ${{ runner.temp }}/kine-windows32
        run: |
          foreach ($standard in @('c++11', 'c++17')) {
            & ".\kine-smoke-$standard.exe" "."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
