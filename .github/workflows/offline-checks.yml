name: Offline SDK regressions

on:
  push:
    branches: [master]
    paths:
      - 'SDK_PYTHON/fx_robot.py'
      - 'marvinSDK_ubuntu*.sh'
      - 'contrlSDK/**'
      - 'contrlSDK100343/**'
      - 'kinematicsSDK/**'
      - 'interferenceCheck/**'
      - 'tests/**'
      - '.github/workflows/offline-checks.yml'
  pull_request:
    branches: [master]
    paths:
      - 'SDK_PYTHON/fx_robot.py'
      - 'marvinSDK_ubuntu*.sh'
      - 'contrlSDK/**'
      - 'contrlSDK100343/**'
      - 'kinematicsSDK/**'
      - 'interferenceCheck/**'
      - 'tests/**'
      - '.github/workflows/offline-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run offline regressions without loading native SDKs
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build both Linux SDK variants without running them
        if: runner.os == 'Linux'
        run: |
          bash -n marvinSDK_ubuntu.sh marvinSDK_ubuntu_100343.sh
          bash marvinSDK_ubuntu.sh
          bash marvinSDK_ubuntu_100343.sh
